name: Deploy Holo Apex API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'worker.ts'
      - 'server.node.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'src/lib/apiBase.ts'
      - 'src/lib/dualCloudSync.ts'
      - 'src/components/SmartCopilotDrawer.tsx'
      - 'src/components/LiveFxTickerCard.tsx'
      - 'src/components/VouchersView.tsx'
      - 'src/components/InvoicesView.tsx'
      - 'src/components/TreasuryView.tsx'
      - 'src/components/BrandStudioView.tsx'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run
      - name: Smoke test Worker routes locally
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/holo-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/api/health > /tmp/holo-health.json; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/holo-worker.log
            echo "::error::Worker did not become ready"
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/holo-health.json
          BAD_JSON_STATUS=$(curl --silent --output /tmp/holo-bad-json.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/supabase/sync \
            -H 'Content-Type: application/json' --data-binary '{"broken":')
          test "$BAD_JSON_STATUS" = "400"
          CONFIG_STATUS=$(curl --silent --output /tmp/holo-valid-json.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/supabase/sync \
            -H 'Content-Type: application/json' --data-binary '{"snapshotJson":"{}"}')
          test "$CONFIG_STATUS" = "503"
          grep -q 'NOT_CONFIGURED' /tmp/holo-valid-json.json
          COPILOT_INVALID_STATUS=$(curl --silent --output /tmp/holo-copilot-invalid.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/ai/copilot \
            -H 'Content-Type: application/json' --data-binary '{"message":"x"}')
          test "$COPILOT_INVALID_STATUS" = "400"
          COPILOT_VALID_STATUS=$(curl --silent --output /tmp/holo-copilot-valid.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/ai/copilot \
            -H 'Content-Type: application/json' --data-binary '{"message":"سلام"}')
          test "$COPILOT_VALID_STATUS" = "503"
          grep -q 'GEMINI_API_KEY' /tmp/holo-copilot-valid.json
          SUPABASE_STATUS=$(curl --silent --output /tmp/holo-supabase-status.json --write-out '%{http_code}' \
            http://127.0.0.1:8787/api/supabase/status)
          test "$SUPABASE_STATUS" = "200"
          grep -q 'NOT_CONFIGURED' /tmp/holo-supabase-status.json

  deploy:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_ACCOUNT_ID != '') }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub secret and CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi
      - name: Deploy Worker
        run: bunx wrangler deploy
