name: Deploy Holo Apex API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'worker.ts'
      - 'server.node.ts'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'src/lib/apiBase.ts'
      - 'src/lib/dualCloudSync.ts'
      - 'src/components/SmartCopilotDrawer.tsx'
      - 'src/components/LiveFxTickerCard.tsx'
      - 'src/components/VouchersView.tsx'
      - 'src/components/InvoicesView.tsx'
      - 'src/components/TreasuryView.tsx'
      - 'src/components/BrandStudioView.tsx'
      - 'src/components/BrandStudioView.tsx'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run

  deploy:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_ACCOUNT_ID != '') }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub secret and CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi
      - name: Deploy Worker
        run: bunx wrangler deploy
